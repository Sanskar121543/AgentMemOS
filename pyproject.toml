[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentmemos"
version = "1.0.0"
description = "Hierarchical Memory OS for LLM Agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Core
    "pydantic>=2.6",
    "python-dotenv>=1.0",

    # gRPC
    "grpcio>=1.62",
    "grpcio-tools>=1.62",
    "protobuf>=4.25",

    # REST Admin API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",

    # Tier: Redis (Working Memory)
    "redis[hiredis]>=5.0",

    # Tier: Pinecone (Episodic Memory)
    "pinecone>=6.0.0",

    # Tier: Neo4j (Semantic Memory)
    "neo4j>=5.19",

    # Tier: PostgreSQL (Procedural Memory)
    "asyncpg>=0.29",

    # Embeddings
    "openai>=1.14",
    "numpy>=1.26",

    # Consolidation / Clustering
    "hdbscan>=0.8.33",
    "scikit-learn>=1.4",

    # Kafka WAL
    "aiokafka>=0.10",

    # Observability
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.23",
    "opentelemetry-exporter-otlp>=1.23",
]

[project.optional-dependencies]
local-embed = [
    "sentence-transformers>=2.7",
    "torch>=2.2",
]

dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-redis",
]

[project.scripts]
agentmemos-server = "agentmemos.server.grpc_server:main"
agentmemos-admin = "agentmemos.server.rest_api:main"

[tool.hatch.build.targets.wheel]
packages = ["agentmemos"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true