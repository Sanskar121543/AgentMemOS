global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    service: agentmemos

scrape_configs:
  - job_name: agentmemos
    static_configs:
      - targets: ["agentmemos:8000"]
    metrics_path: /metrics

  - job_name: redis
    static_configs:
      - targets: ["redis:6379"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka:9092"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres:5432"]
