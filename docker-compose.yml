x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  redis:
    image: redis:7.2-alpine
    container_name: agentmemos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    logging: *default-logging

  neo4j:
    image: neo4j:5.19-community
    container_name: agentmemos-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/agentmemos
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1g
      NEO4J_dbms_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "agentmemos", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    container_name: agentmemos-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: agentmemos
      POSTGRES_PASSWORD: agentmemos
      POSTGRES_DB: agentmemos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentmemos -d agentmemos"]
      interval: 5s
      timeout: 3s
      retries: 15
    logging: *default-logging

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: agentmemos-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/localhost/2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *default-logging

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: agentmemos-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: agentmemos-zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://agentmemos-kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    logging: *default-logging

  opa:
    image: openpolicyagent/opa:0.63.0
    container_name: agentmemos-opa
    restart: unless-stopped
    ports:
      - "8181:8181"
    command:
      - run
      - --server
      - --log-format=json
      - /policies
    volumes:
      - ./opa/policies:/policies:ro
    healthcheck:
      test: ["CMD", "opa", "version"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  agentmemos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentmemos-server
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      opa:
        condition: service_healthy
    ports:
      - "50051:50051"
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: agentmemos
      POSTGRES_DSN: postgresql://agentmemos:agentmemos@postgres:5432/agentmemos
      KAFKA_BROKERS: agentmemos-kafka:29092
      OPA_URL: http://opa:8181
      GRPC_PORT: "50051"
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.connect(('localhost',50051)); s.close()\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: agentmemos-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    logging: *default-logging

  grafana:
    image: grafana/grafana:10.4.0
    container_name: agentmemos-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: agentmemos
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    logging: *default-logging

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data:
  zookeeper_data:
  kafka_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: agentmemos-net